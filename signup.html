<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #f2f5fb;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .signup-page {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
            padding: 32px;
        }
        .signup-header {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }
        .signup-header h1 {
            font-size: 28px;
            margin: 0;
        }
        .signup-header p {
            margin: 0;
            color: #57606a;
            line-height: 1.6;
        }
        .signup-form {
            display: grid;
            gap: 16px;
        }
        .signup-form label {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 14px;
            color: #334155;
        }
        .signup-form input[type="text"],
        .signup-form input[type="email"],
        .signup-form input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d2d6dc;
            border-radius: 12px;
            font-size: 15px;
            background: #f8fafc;
            color: #111827;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .signup-form input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }
        .signup-submit {
            border: none;
            border-radius: 12px;
            padding: 14px 16px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .signup-submit:hover {
            background: #1d4ed8;
        }
        .form-footer {
            font-size: 14px;
            color: #475569;
            text-align: center;
            margin-top: 8px;
        }
        .form-footer a {
            color: #2563eb;
            text-decoration: none;
        }
        .error-message {
            color: #b91c1c;
            font-size: 13px;
        }
        @media (max-width: 500px) {
            body {
                padding: 16px;
            }
            .signup-page {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="signup-page">
        <div class="signup-header">
            <div>
                <span class="figma-icon" style="display:inline-grid; margin-bottom:12px;"><span class="dot red"></span><span class="dot purple"></span><span class="dot blue"></span><span class="dot green"></span><span class="dot orange"></span></span>
                <h1>Sign up</h1>
            </div>
            <p>Create an account to access templates, save your designs, and join the community.</p>
        </div>

        <form class="signup-form" id="signupForm">
            <label>
                Full name
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
            </label>
            <label>
                Email address
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </label>
            <label>
                Password
                <input type="password" id="password" name="password" placeholder="Create a password" required>
            </label>
            <label>
                Confirm password
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required>
            </label>
            <div class="error-message" id="signupError" aria-live="polite"></div>
            <button type="submit" class="signup-submit">Create account</button>
        </form>

        <div class="form-footer">
            Already have an account? <a href="login.html">Log in</a>
        </div>
    </div>

    <script>
        const signupForm = document.getElementById('signupForm');
        const signupError = document.getElementById('signupError');

        signupForm.addEventListener('submit', function (event) {
            event.preventDefault();
            signupError.textContent = '';

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (fullName.length < 2) {
                signupError.textContent = 'Please enter your full name.';
                return;
            }
            if (!email || !email.includes('@')) {
                signupError.textContent = 'Please enter a valid email address.';
                return;
            }
            if (password.length < 6) {
                signupError.textContent = 'Password must be at least 6 characters.';
                return;
            }
            if (password !== confirmPassword) {
                signupError.textContent = 'Passwords do not match.';
                return;
            }

            alert('Signup successful!');
            signupForm.reset();
        });
    </script>
</body>
</html>
