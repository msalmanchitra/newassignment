<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Furniro</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="navbar">
  <div class="container">
    <a class="logo" href="index.html">
      <svg width="40" height="32" viewBox="0 0 40 32" fill="none">
        <path d="M0 32L20 0L40 32H32L20 12L8 32H0Z" fill="#B88E2F"/>
        <path d="M10 32L20 16L30 32H26L20 20L14 32H10Z" fill="#B88E2F"/>
      </svg>
      <span>Furniro</span>
    </a>

    <nav class="menu" id="menu">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>

    <div class="icons">
      <a class="icon-link" href="account.html" aria-label="Account">
        <img src="https://api.iconify.design/mdi:account-alert-outline.svg" alt="Account">
      </a>

      <div class="icon-wrap search-wrap">
        <button class="icon-btn" type="button" aria-label="Search">
          <img src="https://api.iconify.design/mdi:magnify.svg" alt="Search">
        </button>
        <div class="icon-card search-card">
          <h4>Search</h4>
          <form class="search-form">
            <input type="text" placeholder="Search products..." />
            <button type="submit">Go</button>
          </form>
        </div>
      </div>

      <a class="icon-link wishlist-link" href="wishlist.html" aria-label="Wishlist">
        <img src="https://api.iconify.design/mdi:heart-outline.svg" alt="Wishlist">
      </a>

      <a class="icon-link cart-link" href="cart.html" aria-label="Cart">
        <img src="https://api.iconify.design/mdi:shopping-cart-outline.svg" alt="Cart">
        <span class="cart-badge" id="cart-count">0</span>
      </a>
    </div>

    <button class="toggle" id="toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
  </div>
  <div>
</header>


<section class="hero">
  <div class="hero-box">
    <p class="tag">New Arrival</p>
    <h1>Discover Our<br>New Collection</h1>
    <p class="text">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Ut elit tellus, luctus nec ullamcorper mattis.</p>
    <div class="hero-buttons">
      <button class="btn btn-buy-now" type="button">BUY NOW</button>
    </div>
   
  </div>
</section>
 <!-- card section  -->
  <section class="range-section">

        <div class="range-heading">
            <h2>Browse The Range</h2>
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
        </div>

        <div class="range-container">

            <!-- Dining -->
            <div class="range-card" data-category="Dining">
                <div class="image-box">
                    <img
                        src="https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=700&q=85"
                        alt="Dining">
                </div>

                <h3>Dining</h3>
            </div>


            <!-- Living -->
            <div class="range-card" data-category="Living">
                <div class="image-box">
                    <img
                        src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=700&q=85"
                        alt="Living">
                </div>

                <h3>Living</h3>
            </div>


            <!-- Bedroom -->
            <div class="range-card" data-category="Bedroom">
                <div class="image-box">
                    <img
                        src="https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&w=700&q=85"
                        alt="Bedroom">
                </div>

                <h3>Bedroom</h3>
            </div>

        </div>

    </section>

<script src="app.js"></script>

</body>
</html>
