<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Furniro</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="navbar">
  <div class="container">
    <a class="logo" href="index.html">
      <svg width="40" height="32" viewBox="0 0 40 32" fill="none">
        <path d="M0 32L20 0L40 32H32L20 12L8 32H0Z" fill="#B88E2F"/>
        <path d="M10 32L20 16L30 32H26L20 20L14 32H10Z" fill="#B88E2F"/>
      </svg>
      <span>Furniro</span>
    </a>

    <nav class="menu" id="menu">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>

    <div class="icons">
      <a class="icon-link" href="account.html" aria-label="Account">
        <img src="https://api.iconify.design/mdi:account-alert-outline.svg" alt="Account">
      </a>

      <div class="icon-wrap search-wrap">
        <button class="icon-btn" type="button" aria-label="Search">
          <img src="https://api.iconify.design/mdi:magnify.svg" alt="Search">
        </button>
        <div class="icon-card search-card">
          <h4>Search</h4>
          <form class="search-form">
            <input type="text" placeholder="Search products..." />
            <button type="submit">Go</button>
          </form>
        </div>
      </div>

      <div class="icon-wrap">
        <button class="icon-btn" type="button" aria-label="Wishlist">
          <img src="https://api.iconify.design/mdi:heart-outline.svg" alt="Wishlist">
        </button>
        <div class="icon-card">
          <h4>Wishlist</h4>
          <p>Your favorite items appear here.</p>
        </div>
      </div>

      <div class="icon-wrap">
        <button class="icon-btn" type="button" aria-label="Cart">
          <img src="https://api.iconify.design/mdi:shopping-cart-outline.svg" alt="Cart">
        </button>
        <div class="icon-card">
          <h4>Cart</h4>
          <p>Ready to checkout.</p>
        </div>
      </div>
    </div>

    <button class="toggle" id="toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
  </div>
</header>

<section class="hero">
  <div class="hero-box">
    <p class="tag">New Arrival</p>
    <h1>Discover Our<br>New Collection</h1>
    <p class="text">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Ut elit tellus, luctus nec ullamcorper mattis.</p>
    <a href="shop.html" class="btn">BUY NOW</a>
    <img src="./images/hero.png" alt="hero">
  </div>
</section>

<script src="app.js"></script>

</body>
</html>
